<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>香港巴士 ETA · iPad Air</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#101010;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
body{overflow:hidden}
#app{height:100%;height:100vh;display:flex;flex-direction:column}
header{height:64px;flex:0 0 64px;padding:8px 18px;display:flex;align-items:center;justify-content:space-between;background:#181818;border-bottom:1px solid #303030}
.title{font-size:24px;font-weight:700}
.header-info{display:flex;align-items:center;gap:14px;white-space:nowrap}
.weather{font-size:15px;color:#ddd;font-variant-numeric:tabular-nums}
.date{font-size:14px;color:#bbb}
.clock{font-size:23px;font-variant-numeric:tabular-nums}
main{flex:1;display:grid;grid-template-columns:1fr 1.5fr;gap:12px;padding:12px;min-height:0}
.panel{background:#181818;border:1px solid #303030;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.panel h2{margin:0;padding:11px 16px;font-size:20px;background:#202020;flex:0 0 auto}.rows{overflow:auto;flex:1;min-height:0}
.row{display:grid;grid-template-columns:68px 1fr 190px;align-items:center;min-height:58px;height:58px;padding:5px 12px;border-top:1px solid #2b2b2b}
.route{font-size:24px;font-weight:800}.dest{font-size:15px;color:#c9c9c9}.eta-stack{text-align:right;line-height:1.05}.eta{text-align:right;font-size:25px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}.eta-next{margin-top:3px;font-size:12px;font-weight:600;color:#999;font-variant-numeric:tabular-nums;white-space:nowrap}.eta-next.none{color:#777}
.eta.soon{color:#ffd34d}.eta.now{color:#ff7777}.eta.none{color:#888;font-size:17px;white-space:normal}
.eta.remark{font-size:15px;line-height:1.2;white-space:normal;color:#ffb35c}
.meta{font-size:10px;color:#777;text-align:right;margin-top:1px}
footer{height:42px;flex:0 0 42px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;background:#181818;border-top:1px solid #333;color:#aaa;font-size:12px}
#updated.ok{color:#8fd18f}#updated.fail{color:#ffb35c}
.badge{padding:4px 8px;border-radius:7px;background:#242424}
@media (max-width:900px){
  header{height:58px;flex-basis:58px;padding:7px 14px}.title{font-size:20px}.header-info{gap:10px}.weather{font-size:13px}.date{font-size:12px}.clock{font-size:19px}
  main{grid-template-columns:1fr;grid-template-rows:225px minmax(0,1fr);gap:9px;padding:9px}
  .panel h2{padding:9px 13px;font-size:18px}
  .row{grid-template-columns:58px 1fr 175px;min-height:62px;height:62px;padding:4px 10px}
  .route{font-size:22px}.dest{font-size:14px}.eta{font-size:22px}.eta-next{font-size:11px}.eta.none{font-size:15px}.eta.remark{font-size:14px}.meta{font-size:9px}
  footer{height:38px;flex-basis:38px;padding:0 10px;font-size:11px}
}
@media (max-width:500px){
  /* iPhone-only layout. Desktop and iPad rules above are intentionally untouched. */
  header{height:76px;flex-basis:76px;padding:6px 10px;display:block;overflow:hidden}
  .title{font-size:17px;line-height:24px;white-space:nowrap;display:block}
  .header-info{height:40px;display:flex;align-items:center;gap:5px;overflow:hidden;white-space:nowrap}
  .weather{font-size:10px;flex:0 0 auto}
  .warnings{font-size:10px;flex:0 0 auto}
  .date{font-size:9px;flex:0 0 auto}
  .clock{font-size:14px;flex:0 0 auto}
  main{grid-template-rows:auto minmax(0,1fr);padding:6px;gap:6px}
  .panel h2{font-size:16px;padding:7px 10px}.row{grid-template-columns:50px 1fr 150px;height:52px;min-height:52px}.route{font-size:19px}.dest{font-size:12px}.eta{font-size:19px}.eta-next{font-size:10px}.eta.remark{font-size:12px}
  .rows{overflow:auto}
}

.warnings{font-size:15px;color:#ddd;font-variant-numeric:tabular-nums;white-space:nowrap}
.warnings.active{font-weight:700}
.status-dot{font-family:Arial,sans-serif;font-weight:700;font-size:20px;line-height:0;vertical-align:-1px}
.status-dot.green{color:#35d07f}
.status-dot.orange{color:#ff9f43}
.status-dot.yellow{color:#ffd43b}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="title">🚌 香港巴士 ETA</div>
  <div class="header-info">
    <div class="weather" id="weather">🌤️ 觀塘 --°C　最高--°　最低--°</div><div class="warnings" id="warnings"><span class="status-dot green">●</span> 無天氣警告</div>
    <div class="date" id="date">----年--月--日 星期-</div>
    <div class="clock" id="clock">--:--:--</div>
  </div>
</header>
<main>
<section class="panel"><h2>📍 彩福總站</h2><div class="rows" id="cai-fu"></div></section>
<section class="panel"><h2>🚉 九龍灣鐵路站</h2><div class="rows" id="kowloon-bay"></div></section>
</main>
<footer><span id="updated"><span class="status-dot orange">●</span> 更新中　上次成功：尚未取得</span><span class="badge" id="status">啟動中</span></footer>
</div>
<script>
/*
 v0.6.16
 - Replaced newer green/orange/yellow circle emojis with CSS-colored legacy-safe bullet dots for iOS 12 compatibility.
 - Header adds Chinese date plus HKO Kwun Tong current/high/low temperature and simplified weather icon.
 - KMB/Citybus ETA remains on a 30-second polling cycle; countdown updates every second.
 - KMB ETA remarks (rmk_tc) replace the large ETA time when a current ETA has a remark,
   matching the electronic-board style the user remembers from the KMB app.
 - A failed refresh never clears an already-known ETA. Footer reports whether the latest
   bus-data refresh had any failures.
 - Weather is fetched separately from HKO and retained if a weather refresh fails.
*/
const CONFIG={
 refreshMs:30000,
 weatherRefreshMs:300000,
 caiFu:[
  {route:"9",dest:"尖沙咀",apiDest:"尖沙咀",co:"KMB",stopId:"C6795D3E5B50AD5A",serviceType:"1"},
  {route:"28B",dest:"啟德",apiDest:"啟德",co:"KMB",stopId:"147E43B06313402E",serviceType:"1"},
  {route:"2X",dest:"美孚",apiDest:"美孚",co:"KMB",stopId:"534DB02642325617",serviceType:"1"}
 ],
 kowloonBay:[
  {route:"74X",dest:"觀塘碼頭",apiDest:"觀塘碼頭",co:"KMB",stopId:"060699911C9E300F",serviceType:"1"},
  {route:"80",dest:"觀塘碼頭",apiDest:"觀塘碼頭",co:"KMB",stopId:"060699911C9E300F",serviceType:"1"},
    {route:"80P",dest:"觀塘碼頭",apiDest:"觀塘碼頭",co:"KMB",stopId:"060699911C9E300F",serviceType:"1"},
  {route:"40",dest:"麗港城",apiDest:"麗港城",co:"KMB",stopId:"66B78B49B8E626C9",serviceType:"1"},
  {route:"40P",dest:"觀塘碼頭",apiDest:"觀塘碼頭",co:"KMB",stopId:"66B78B49B8E626C9",serviceType:"1"},
  {route:"11B",dest:"觀塘翠屏道",apiDest:"觀塘",co:"KMB",stopId:"66B78B49B8E626C9",serviceType:"1"},
  {route:"1A",dest:"中秀茂坪",apiDest:"中秀茂坪",co:"KMB",stopId:"8C09B3648DCDAF3C",serviceType:"1"},
  {route:"11C",dest:"竹園",apiDest:"上秀茂坪",co:"KMB",stopId:"8C09B3648DCDAF3C",serviceType:"1"},
  {route:"E22",dest:"藍田",apiDest:"藍田",co:"CTB",stopId:null,direction:"inbound",serviceType:null}
 ]
};
const state=new Map();

function keyFor(id,i){return id+"::"+i}
function esc(s){
 return String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
}
function render(id,list){
 document.getElementById(id).innerHTML=list.map((x,i)=>`
 <div class="row">
  <div class="route">${esc(x.route)}</div>
  <div><div class="dest">${esc(x.dest)}</div><div class="meta">${esc(x.co)}</div></div>
  <div class="eta-stack">
   <div class="eta none" id="eta-${id}-${i}">載入中…</div>
   <div class="eta-next none" id="next-${id}-${i}">下一班：--</div>
  </div>
 </div>`).join("");
}
render("cai-fu",CONFIG.caiFu);render("kowloon-bay",CONFIG.kowloonBay);

const weekdays=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function pad2(n){return String(n).padStart(2,"0")}
function updateDateClock(){
 const d=new Date();
 document.getElementById("date").textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${weekdays[d.getDay()]}`;
 document.getElementById("clock").textContent=`${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
}
updateDateClock();setInterval(updateDateClock,1000);

function setEta(el,text,mins,remark=false){
 el.textContent=text;
 el.className="eta "+(remark?"remark":mins!==null&&mins<=2?"now":mins!==null&&mins<=8?"soon":mins===null?"none":"");
}
function setNextEta(el,text,mins){
 el.textContent=text;
 el.className="eta-next"+(mins===null?" none":"");
}
function setTarget(id,i,etaList,sourceTimestamp){
 const etas=(etaList||[])
  .map(d=>({
   etaMs:new Date(d.eta).getTime(),
   sourceTimestamp:d.data_timestamp||sourceTimestamp||null,
   remark:(d.rmk_tc||"").trim()
  }))
  .filter(x=>Number.isFinite(x.etaMs))
  .sort((a,b)=>a.etaMs-b.etaMs);
 state.set(keyFor(id,i),{etas,sourceTimestamp:sourceTimestamp||null});
}
function clearTarget(id,i){
 state.delete(keyFor(id,i));
 const nextEl=document.getElementById(`next-${id}-${i}`);
 if(nextEl)setNextEta(nextEl,"下一班：--",null);
}
function updateCountdowns(){
 const now=Date.now();
 state.forEach((v,k)=>{
  const p=k.split("::"),id=p[0],i=p[1];
  const el=document.getElementById(`eta-${id}-${i}`);
  const nextEl=document.getElementById(`next-${id}-${i}`);
  if(!el||!nextEl)return;

  const future=v.etas.filter(x=>x.etaMs>now);
  const current=future[0]||null;
  const following=future[1]||null;

  if(!current){
   setEta(el,"沒有預定班次",null);
   setNextEta(nextEl,"下一班：--",null);
   return;
  }

  const ms=current.etaMs-now;
  // "原定班次" / "Scheduled Bus" is a normal KMB status label, NOT a
  // traffic/service warning. Keep the actual countdown visible in that case.
  const remark=current.remark;

  /*
   * KMB rmk_tc is a general ETA remark field, not a dedicated "traffic
   * jam" flag. "原定班次" is a normal remark and must NOT replace ETA.
   *
   * To avoid false positives, only remarks containing an explicitly
   * recognised traffic/service-disruption keyword are allowed to replace
   * the large ETA. Unknown remarks keep the ETA visible.
   */
  const TRAFFIC_REMARK_KEYWORDS=[
    "路線阻塞","交通阻塞","道路阻塞","交通擠塞","道路擠塞","交通堵塞",
    "塞車","交通意外","交通事故","道路事故","意外事故",
    "封路","道路封閉","封閉道路","交通管制","道路工程",
    "改道","繞道","暫停服務","服務暫停","服務受阻","服務受影響",
    "班次受阻","班次延誤","延誤","取消班次","取消服務",
    "不停站","車站停用","巴士站停用","站點停用"
  ];
  const isTrafficRemark=TRAFFIC_REMARK_KEYWORDS.some(k=>remark.includes(k));

  if(isTrafficRemark){
   // A confirmed traffic/service-disruption remark replaces the large ETA.
   setEta(el,remark,null,true);
  }else if(ms<=60000){
   setEta(el,"即將到站",0);
  }else{
   const mins=Math.floor(ms/60000);
   setEta(el,mins+" 分鐘",mins);
  }

  if(following){
   const nextMs=following.etaMs-now;
   const nextText=nextMs<=60000?"即將到站":Math.floor(nextMs/60000)+" 分鐘";
   setNextEta(nextEl,"下一班："+nextText,nextMs<=60000?0:Math.floor(nextMs/60000));
  }else{
   setNextEta(nextEl,"下一班：--",null);
  }
 });
}
setInterval(updateCountdowns,1000);

async function kmbEta(x){
 const u=`https://data.etabus.gov.hk/v1/transport/kmb/eta/${x.stopId}/${encodeURIComponent(x.route)}/${x.serviceType}`;
 const r=await fetch(u,{cache:"no-store"});
 if(!r.ok)throw new Error("HTTP "+r.status);
 const j=await r.json();
 return (j.data||[]).filter(d=>d.eta&&(!x.apiDest||(d.dest_tc||"").includes(x.apiDest))).sort((a,b)=>new Date(a.eta)-new Date(b.eta));
}
async function resolveCtbStop(x){
 if(x.stopId)return x.stopId;
 const cacheKey=`hkbus_ctb_stop_${x.route}_${x.direction||"outbound"}`;
 try{
  const cached=localStorage.getItem(cacheKey);
  if(cached){x.stopId=cached;return cached;}
 }catch(e){}
 const dir=x.direction||"outbound";
 const u=`https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/${encodeURIComponent(x.route)}/${dir}`;
 const r=await fetch(u,{cache:"no-store"});
 if(!r.ok)throw new Error("CTB route-stop HTTP "+r.status);
 const j=await r.json();
 const stops=j.data||[];
 const candidates=await Promise.all(stops.map(async item=>{
  const stopId=item.stop;
  try{
   const sr=await fetch(`https://rt.data.gov.hk/v2/transport/citybus/stop/${stopId}`,{cache:"no-store"});
   if(!sr.ok)return null;
   const sj=await sr.json(),d=sj.data||{};
   return (d.name_tc||"").indexOf("九龍灣站")>=0?stopId:null;
  }catch(e){return null;}
 }));
 const found=candidates.find(Boolean);
 if(found){
  x.stopId=found;
  try{localStorage.setItem(cacheKey,found)}catch(e){}
  return found;
 }
 throw new Error("CTB Kowloon Bay stop not found");
}
async function ctbEta(x){
 const stopId=await resolveCtbStop(x);
 const u=`https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${stopId}/${encodeURIComponent(x.route)}`;
 const r=await fetch(u,{cache:"no-store"});
 if(!r.ok)throw new Error("HTTP "+r.status);
 const j=await r.json();
 return (j.data||[]).filter(d=>d.eta&&(!x.apiDest||(d.dest_tc||"").includes(x.apiDest))).sort((a,b)=>new Date(a.eta)-new Date(b.eta));
}

async function refreshGroup(id,list){
 let failures=0;
 for(let i=0;i<list.length;i++){
  const x=list[i],el=document.getElementById(`eta-${id}-${i}`);
  try{
   const data=x.co==="CTB"?await ctbEta(x):await kmbEta(x);
   const d=data[0];
   if(!d){
    clearTarget(id,i);
    setEta(el,"沒有預定班次",null);
    continue;
   }
   setTarget(id,i,data,d.data_timestamp||null);
   updateCountdowns();
  }catch(e){
   failures++;
   // Keep an already-known ETA visible if a refresh briefly fails.
   if(!state.has(keyFor(id,i)))setEta(el,"暫時無法取得",null);
  }
 }
 return failures;
}

let lastSuccessfulBusUpdate=null;
let refreshing=false;
async function refresh(){
 if(refreshing)return;
 refreshing=true;
 document.getElementById("status").textContent="更新中…";
 const results=await Promise.all([
  refreshGroup("cai-fu",CONFIG.caiFu),
  refreshGroup("kowloon-bay",CONFIG.kowloonBay)
 ]);
 const failures=results.reduce((a,b)=>a+b,0);
 const now=new Date();

 if(failures===0){
  lastSuccessfulBusUpdate=now;
  const t=now.toLocaleTimeString("zh-HK",{hour12:false});
  const updated=document.getElementById("updated");
  updated.innerHTML=`<span class="status-dot green">●</span> 資料正常　最後更新：${t}`;
  updated.className="ok";
  document.getElementById("status").textContent="每30秒更新";
 }else{
  const updated=document.getElementById("updated");
  updated.className="fail";
  if(lastSuccessfulBusUpdate){
   updated.innerHTML=`<span class="status-dot orange">●</span> 更新失敗　上次成功：${lastSuccessfulBusUpdate.toLocaleTimeString("zh-HK",{hour12:false})}`;
  }else{
   updated.innerHTML='<span class="status-dot orange">●</span> 更新失敗　尚未成功取得';
  }
  document.getElementById("status").textContent=`部分失敗（${failures}）`;
 }
 refreshing=false;
}

const hkoIconMap={
  50:"☀️",
  51:"🌤️",52:"🌤️",
  53:"🌦️",54:"🌦️",
  60:"☁️",61:"☁️",
  62:"🌧️",63:"🌧️",64:"🌧️",
  65:"⛈️"
};

function getHkoForecastTemp(j){
 const data=(j.temperature&&j.temperature.data)||[];
 // Prefer the explicit "最高氣溫／最低氣溫" forecast fields when present.
 const maxCandidates=data.filter(x=>/最高|最高氣溫/.test(x.place||""));
 const minCandidates=data.filter(x=>/最低|最低氣溫/.test(x.place||""));
 return {
  max:maxCandidates.length?maxCandidates[0].value:null,
  min:minCandidates.length?minCandidates[0].value:null
 };
}

window.hkoTodayForecast={max:null,min:null,date:null};


const hkoWarningMap={
  WFIREY:"🔥",WFIRER:"🔥",WFROST:"❄️",WHOT:"🥵",WCOLD:"🥶",
  WMSGNL:"🌬️",WRAINA:"●",WRAINR:"🔴",WRAINB:"⚫",
  WFNTSA:"💧",WL:"⛰️",WTMW:"🌊",WTS:"⛈️",
  TC1:"1️⃣",TC3:"3️⃣",TC8NE:"8️⃣",TC8SE:"8️⃣",TC8SW:"8️⃣",TC8NW:"8️⃣",
  TC9:"9️⃣",TC10:"🔟",WTCPRE8:"🔔"
};

function hkoWarningLabel(code,name){
  if(code==="WRAINA") return `<span class="status-dot yellow">●</span> ${name||code}`;
  return `${hkoWarningMap[code]} ${name||code}`;
}

async function refreshWarnings(){
  try{
    const response=await fetch(
      "https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc",
      {cache:"no-store"}
    );
    if(!response.ok) return;

    const data=await response.json();
    const items=[];

    const scan=(value)=>{
      if(!value) return;
      if(Array.isArray(value)){value.forEach(scan);return;}
      if(typeof value!=="object") return;

      const code=value.code||value.warningCode||value.subtype||value.warningStatementCode;
      const name=value.name||value.warningName||value.text||value.warningStatement;
      const action=value.actionCode;

      if(action!=="CANCEL" && code && hkoWarningMap[code]){
        items.push({code,name});
      }

      Object.values(value).forEach(v=>{
        if(v && typeof v==="object") scan(v);
      });
    };

    scan(data);

    const seen=new Set();
    const unique=items.filter(x=>{
      const key=x.code+"|"+(x.name||"");
      if(seen.has(key)) return false;
      seen.add(key);
      return true;
    });

    const el=document.getElementById("warnings");
    if(!el) return;

    if(unique.length){
      el.innerHTML=unique.map(x=>hkoWarningLabel(x.code,x.name)).join("　");
      el.className="warnings active";
    }else{
      el.innerHTML='<span class="status-dot green">●</span> 無天氣警告';
      el.className="warnings";
    }
  }catch(e){
    // Keep the last successful warning state on transient failures.
  }
}

async function refreshWeather(){
 try{
  const currentUrl="https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc";
  const forecastUrl="https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc";

  // Keep the two HKO requests independent for Safari/iOS 12 compatibility.
  let current=null;
  let forecast=null;

  try{
   const response=await fetch(currentUrl,{cache:"no-store"});
   if(response.ok) current=await response.json();
  }catch(e){}

  try{
   const response=await fetch(forecastUrl,{cache:"no-store"});
   if(response.ok) forecast=await response.json();
  }catch(e){}

  if(current){
   const temp=(current.temperature&&current.temperature.data||[]).find(x=>x.place==="觀塘");
   if(temp){
    const iconCode=Array.isArray(current.icon)&&current.icon.length?Number(current.icon[0]):null;
    const icon=hkoIconMap[iconCode]||"🌤️";
    const currentForecast=window.hkoTodayForecast||{max:null,min:null,date:null};
    const maxText=currentForecast.max!==null?`最高${currentForecast.max}°`:"最高--°";
    const minText=currentForecast.min!==null?`最低${currentForecast.min}°`:"最低--°";
    document.getElementById("weather").textContent=
      `${icon} 觀塘 ${temp.value}°C　${maxText}　${minText}`;
   }
  }

  if(forecast){
   const todayKey=new Date().getFullYear().toString()+
     String(new Date().getMonth()+1).padStart(2,"0")+
     String(new Date().getDate()).padStart(2,"0");

   const today=(forecast.weatherForecast||[]).find(x=>String(x.forecastDate)===todayKey);

   if(today){
    const max=today.forecastMaxtemp&&today.forecastMaxtemp.value;
    const min=today.forecastMintemp&&today.forecastMintemp.value;
    window.hkoTodayForecast={
      max:max!==undefined&&max!==null?max:null,
      min:min!==undefined&&min!==null?min:null,
      date:todayKey
    };
   }else{
    window.hkoTodayForecast={max:null,min:null,date:todayKey};
   }

   const currentText=document.getElementById("weather").textContent;
   const tempMatch=currentText.match(/觀塘\s+([^　]+°C)/);
   const iconMatch=currentText.match(/^(\S+)/);
   if(tempMatch){
    const f=window.hkoTodayForecast;
    const maxText=f.max!==null?`最高${f.max}°`:"最高--°";
    const minText=f.min!==null?`最低${f.min}°`:"最低--°";
    document.getElementById("weather").textContent=
      `${iconMatch?iconMatch[1]:"🌤️"} 觀塘 ${tempMatch[1]}　${maxText}　${minText}`;
   }
  }else if(!window.hkoTodayForecast){
   window.hkoTodayForecast={max:null,min:null,date:null};
  }
}catch(e){
  // Keep the last successful HKO values on transient failures.
 }
}

refreshWeather();
refreshWarnings();
setInterval(refreshWeather,CONFIG.weatherRefreshMs);
setInterval(refreshWarnings,CONFIG.weatherRefreshMs);

// Run once now, then poll every 30 seconds.
refresh();
setInterval(refresh,CONFIG.refreshMs);
</script>
